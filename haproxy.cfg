global
    log /dev/log local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:9090
    default_backend tomcat_back

backend tomcat_back
    balance roundrobin
    option httpchk GET /
    server tomcat1 127.0.0.1:9091 check
    server tomcat2 127.0.0.1:9092 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
